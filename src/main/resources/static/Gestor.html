<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spartacus GYM</title>
    <link rel="stylesheet" href="Style.css"/>
</head>
<body>
    <header>
        <div class="container">
            <h1>Spartacus GYM</h1>
            <p>Gestor de Miembros</p>
        </div>
    </header>
    
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-users">0</div>
                <div class="stat-label">Total de Miembros</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="morning-users">0</div>
                <div class="stat-label">Turno Mañana</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="active-users">0</div>
                <div class="stat-label">Miembros Activos</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="form-container">
                <h2 id="form-title">Agregar Nuevo Miembro</h2>
                <form id="user-form">
                    <input type="hidden" id="user-id">
                    
                    <div class="form-group">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" required placeholder="Sin puntos ni espacios">
                    </div>
                    
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" min="16" max="100" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="turno">Turno</label>
                        <select id="turno" required>
                            <option value="">Selecciona un turno</option>
                            <option value="mañana">Mañana</option>
                            <option value="tarde">Tarde</option>
                            <option value="noche">Noche</option>
                        </select>
                    </div>
                    
                    <div class="actions">
                        <button type="submit" class="btn-success" id="submit-btn">Agregar Miembro</button>
                        <button type="button" class="btn-danger" id="cancel-btn" style="display: none;">Cancelar</button>
                    </div>
                </form>
            </div>
            
            <div class="users-container">
                <h2>Lista de Miembros</h2>
                
                <div class="filters">
                    <select class="filter-select" id="filter-turno">
                        <option value="">Todos los turnos</option>
                        <option value="mañana">Mañana</option>
                        <option value="tarde">Tarde</option>
                        <option value="noche">Noche</option>
                    </select>
                    <!-- Filtro de estado temporalmente oculto hasta implementar lógica completa de pagos -->
                </div>
                
                <div id="users-list">
                    <!-- Los usuarios se cargarán aquí dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <script src="./Scrip.js"></script>
    
    <footer>
        <div class="container">
            <p id="footer-text"></p>
        </div>
    </footer>
</body>
</html>
